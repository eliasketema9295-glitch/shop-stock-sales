services:
  db:
    image: postgres:16-alpine
    container_name: shop-stock-sales-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop_stock_sales}
      POSTGRES_USER: ${POSTGRES_USER:-shop_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop_app} -d ${POSTGRES_DB:-shop_stock_sales}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
